  <rect x="330" y="60" width="40" height="40" fill="#6366F1" stroke="#4F46E5" stroke-width="2"/>
  
  <!-- Edifício 3 - Casa moderna -->
  <rect x="450" y="250" width="100" height="100" fill="#60A5FA" stroke="#3B82F6" stroke-width="2"/>
