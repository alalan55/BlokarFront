  <line x1="30" y1="80" x2="40" y2="80" stroke="#FBBF24" stroke-width="4"/>
  <line x1="120" y1="80" x2="130" y2="80" stroke="#FBBF24" stroke-width="4"/>
  <line x1="45" y1="45" x2="55" y2="55" stroke="#FBBF24" stroke-width="4"/>
