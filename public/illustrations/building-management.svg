  <circle cx="560" cy="60" r="15" fill="white" opacity="0.8"/>
  
  <circle cx="420" cy="40" r="10" fill="white" opacity="0.8"/>
  <circle cx="440" cy="40" r="15" fill="white" opacity="0.8"/>
  <circle cx="460" cy="40" r="10" fill="white" opacity="0.8"/>
